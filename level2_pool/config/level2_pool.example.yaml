service:
  host: 0.0.0.0
  port: 8001
  log_level: INFO

site:
  name: site_a
  target_url: http://www.baidu.com

level1:
  base_url: http://127.0.0.1:8000

sync:
  interval: 3.0
  timeout: 5.0

test:
  latency_threshold_ms: 2000
  connect_timeout: 3.0
  concurrency: 20
  workers: 2  # 缺省自动 = max(1, concurrency//10)
  buffer: 20

revalidate_interval: 60.0
ttl_sweep_interval: 5.0
