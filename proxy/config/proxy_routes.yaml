service:
  host: 0.0.0.0
  port: 9000
  log_level: INFO

registry:
  route_file: config/proxy_routes.yaml
  route_url: ""
  reload_interval: 30.0

level1:
  base_url: http://127.0.0.1:8000
  timeout: 5.0

dispatch:
  timeout: 10.0

sites:
  - name: baidu
    base_url: http://127.0.0.1:8001
    target_url: https://www.baidu.com
  - name: gongshang
    base_url: http://127.0.0.1:8002
    target_url: https://gongshang.mingluji.com
  - name: bing
    base_url: http://127.0.0.1:8003
    target_url: https://www.bing.com